version: 2

updates:
  # The audit job in ci.yml fails the build on a high/critical advisory in a
  # production dependency. A gate with nothing keeping dependencies current
  # eventually fires on an unrelated PR, and its author's only way forward is an
  # upgrade they never signed up for. These updates are the way forward,
  # arriving on their own schedule instead of on someone else's deadline.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps land as one PR per group. Individually they rarely
      # merit a review, and a single CI run across ten of them carries the same
      # signal as ten runs across one — at a tenth of the review cost.
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
        # monaco-editor is 0.x, where semver makes MINOR the breaking slot — so
        # "minor" here does not mean what it means for every other entry, and
        # grouping it hides a breaking change among routine ones. 0.55→0.56
        # changed the package's `exports` map and broke the
        # `monaco-editor/esm/vs/editor/editor.api` specifier `main.tsx` imports
        # (that import is deliberate: it keeps the TS/JSON/CSS/HTML language
        # services out of the bundle, which is what lets the CSP drop
        # 'unsafe-eval'). It arrives on its own from now on.
        exclude-patterns:
          - monaco-editor
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      # Two families are exempt from the majors rule below, because for them
      # "one PR at a time" and "a PR that can install" are the same thing asked
      # two ways. Each of these packages peer-depends on its sibling's major, so
      # a bump arriving alone pins one half against the other and `npm ci` dies
      # with ERESOLVE before a single test runs. That PR is not risky, it is
      # unrunnable — no amount of review makes it mergeable, and the only way
      # anyone has ever landed one is by assembling the other half by hand.
      # Grouping them batches nothing unrelated: the family is one decision, and
      # this is the only shape in which it can be read.
      vitest:
        # The tighter of the two couplings: @vitest/coverage-v8 peer-depends on
        # the exact vitest it ships beside — 4.1.10's peer is `vitest@4.1.10`,
        # not `^4.1.10` — so even a patch cannot move alone. #260 proposed
        # vitest 5.0.1 against coverage-v8 4.1.10 and could never have installed.
        # Nothing was wrong with the version: 5.0.1 passes the suite here once
        # the two move together.
        patterns:
          - vitest
          - "@vitest/*"
        update-types: [major]
      vite:
        # The same failure, already paid for once. #215 and #217 raised vite 8
        # and @vitejs/plugin-react 6 separately and neither could go green:
        # plugin-react 6 requires `vite@^8`, and vite 8 is refused by
        # plugin-react 5's peer range, so each failed at `npm ci` against the
        # other's pin. They had to be re-assembled into one commit by hand.
        # @tailwindcss/vite is deliberately not listed — it is a Tailwind
        # package that happens to be named for its host, and it tracks
        # Tailwind's major rather than Vite's.
        patterns:
          - vite
          - "@vitejs/plugin-react"
        update-types: [major]
    # Every other major stays out of every group, so it arrives one PR at a
    # time. react 19→20 is a change to read, not to batch. The exemptions
    # above are not an argument against that rule — they are the cases where
    # the unit that has to be read is a pair rather than a package.
    ignore:
      # @types/node is not a dependency like the others — it describes the Node
      # the code runs on, and `.nvmrc` is what decides that. A types major that
      # arrives ahead of the runtime is worse than a stale one: it describes
      # APIs that do not exist yet, so `tsc` accepts code that fails when it
      # runs. The two halves of this repo had drifted apart on exactly that —
      # #243 let 26 into packages/mcp-server while the root stayed on 24 and
      # #265 proposed moving the root to match — and the answer is that both
      # follow `.nvmrc`, which says 24.
      #
      # The cost is the one the Azure exclusion below also carries: this pin no
      # longer advances on its own. When the Node line moves — 26 becomes
      # Active LTS in October 2026 — delete this entry and take the types major
      # in the same change that moves `.nvmrc`, not before it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # `marked` is a devDependency only so the hover tests can render Markdown
      # the way the editor will. Monaco bundles its own copy and pins it exactly
      # (monaco-editor@0.55.1 ships 14.0.0), so the useful version is whichever
      # Monaco ships, not the newest. Move it in the same change that moves
      # monaco-editor, to the version that release pins.
      - dependency-name: "marked"

  # `directory` is not recursive, so the entry above never sees
  # packages/mcp-server's lockfile. That was harmless while nothing audited that
  # tree; now that the audit job gates on its production dependencies, the
  # opening comment applies to it word for word — a gate with nothing keeping
  # the tree current is a gate that eventually fires on an unrelated PR.
  - package-ecosystem: npm
    directory: "/packages/mcp-server"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      # One group rather than the production/development split above: this
      # package has six direct dependencies, and splitting six across two PRs
      # buys nothing but a second review.
      mcp-server-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    # Majors stay out of the group for the same reason they do above — and note
    # that @modelcontextprotocol/sdk majors move a protocol version, which is a
    # change to read against the spec rather than to wave through.
    ignore:
      # Same reason as the root entry above: this package's `engines` floor and
      # the Node it is tested on are `.nvmrc`'s, so its types follow `.nvmrc`
      # too. Both entries need the rule — `directory` is not recursive, so
      # nothing the root says reaches here.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # Actions are pinned to commit SHAs (#138), which is what stops a mutable tag
  # from moving an unreviewed change into a job holding the deploy credentials.
  # A SHA cannot move on its own, so without something raising the pin forward
  # it rots into a permanently stale action; these updates are that something.
  # Dependabot rewrites the SHA and the trailing `# vN` comment together.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    ignore:
      # The one action the SHA-raising above cannot be trusted with. Upstream
      # publishes `v1` as both a tag and a branch: the tag is frozen at
      # 2021-03-03, the branch is where the action is maintained, and this repo
      # pins the branch head deliberately (see azure-static-web-apps.yml, which
      # explains why). Dependabot resolves `v1` to the tag, sees a SHA that is
      # not the pinned one, and proposes it as an update — so every run asks to
      # move the deploy BACKWARDS by three and a half years, onto a build that
      # predates the `skip_api_build` input the workflow passes. #219 was that
      # PR; the same regression had already been fixed once before it.
      #
      # The cost is that this pin no longer rots forward on its own. Raising it
      # means reading the v1 branch and updating the SHA by hand.
      - dependency-name: "Azure/static-web-apps-deploy"
