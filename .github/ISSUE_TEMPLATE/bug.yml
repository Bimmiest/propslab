name: Bug Report
description: Report unexpected behavior or a crash
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this issue. Please provide as much detail as possible.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
      placeholder: Describe the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any additional information (browser, OS, config examples, etc.)
