name: Bug report
description: Something does not do what it says it does
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you saw, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest input and the shortest sequence of steps that show the problem.
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: build
    attributes:
      label: Version and build
      description: Select the version at the right of the status bar. The About dialog shows the version and the build, for example "Propslab 1.3.0, build 9f9744f", and its Copy button copies them.
  - type: textarea
    id: context
    attributes:
      label: Other information
      description: The browser, the operating system, a config example, and other facts that help to find the cause.
