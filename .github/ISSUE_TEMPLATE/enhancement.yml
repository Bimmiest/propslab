name: Enhancement Request
description: Suggest an improvement or new feature
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the suggestion! Please describe what you'd like to see.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What enhancement would you like?
      placeholder: Describe the feature or improvement
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why would this be useful?
      placeholder: Explain the problem this solves or the use case it enables
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other relevant information
