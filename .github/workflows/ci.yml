name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The weekly run is the only thing that re-exercises the suite against a
  # current runner image, which is where toolchain drift shows up first, and
  # it is when the randomised job runs. audit.yml runs weekly for its own
  # reason.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only unless a job asks for more. Nothing here needs the token: the
# Playwright `github` reporter writes its annotations through workflow
# commands on stdout, not the API.
permissions:
  contents: read

# Three pushes to a PR currently grade the same final commit three times, and
# only the last verdict is ever read. Superseded runs are cancelled — except on
# main, where each push is a distinct commit whose status stands on its own
# (and whose green run is what the deploy is judged against). A push gets a
# group of its own commit: a group holds one running and one pending run, and
# a newer pending run cancels the older one even without cancel-in-progress,
# so with one group for main a commit pushed between two others lost its CI
# verdict (#573).
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The app's checks, in three jobs that run side by side, and `ci`, which
  # passes only when every job of this workflow did (#573). They were one
  # serial job: a format error and a test failure took two pushes to find,
  # and a slow runner could reach its timeout. `ci` keeps the name the ruleset
  # on main and scripts/lib/branchProtection.mjs require, so a PR cannot
  # merge with any job here red, including the MCP server's Windows and macOS
  # legs, and the deploy, which waits for this whole run to pass, gates on the
  # same jobs. The audit is a workflow of its own (audit.yml), so a new
  # advisory does not hold up a deploy.
  #
  # The webServer has its own 180s timeout, but nothing bounds a wedged
  # browser or a hung install; without a job timeout the ceiling is six hours.
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Nothing in these jobs talks to the remote after checkout, and they
      # run dependency code that has no business finding a token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Node from .nvmrc, the npm cache, and `npm ci --ignore-scripts`, from
      # the shared action (#602). .nvmrc is kept in step with package.json
      # "engines". The pin tracks Active LTS rather than latest, and the two
      # failure modes it steers between have both bitten here: CI once built
      # on an end-of-life Node 20 while .nvmrc pinned a non-LTS 25.x, so
      # neither matched the other nor what the deploy ran. 22 entered
      # maintenance in October 2025, which puts the actively supported line at
      # 24 until October 2026.
      #
      # --ignore-scripts, as the deploy build installs (azure-static-web-apps.yml):
      # CI must test the tree that ships, not one that also ran install scripts.
      # Nothing here needs them. The only lockfile entries with an install
      # script are fsevents (macOS-only, optional) and, in the MCP server's,
      # esbuild, whose postinstall only verifies the platform binary and swaps
      # a launcher shim for it; the binary arrives through optionalDependencies
      # and the package works without the swap. pcre2-wasm-utf16 is prebuilt
      # and has no install or prepare script.
      - uses: Bimmiest/shared-workflows/.github/actions/setup-node-project@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0
        with:
          # Both lockfiles: this job installs the MCP server's deps too (see
          # the next step), so its lockfile belongs in the cache key.
          cache-dependency-path: |
            package-lock.json
            packages/mcp-server/package-lock.json

      - name: Install MCP server dependencies
        # Lint below is type-aware over the whole repo (projectService), and
        # packages/mcp-server resolves @modelcontextprotocol/sdk and zod from
        # its own node_modules. Without this install those types don't
        # resolve, and every use reports as an unsafe `any`.
        run: npm ci --ignore-scripts --prefix packages/mcp-server

      - name: Verify the regex engine's WebAssembly
        # pcre2-wasm-utf16 is a git dependency: the lockfile pins its commit
        # but records no integrity hash, and npm audit cannot see it. The
        # package ships the checksum its build produced; a binary that does not
        # match it is not the one upstream built and published. Both installed
        # copies are checked: the app's, which ships, and the MCP server's.
        # Every job that installs the package runs this (mcp-server and
        # mutation below, the deploy build too), #504.
        run: |
          node scripts/check-wasm-checksum.mjs
          node scripts/check-wasm-checksum.mjs packages/mcp-server

      - name: Lint
        run: npm run lint

      - name: Format check
        # Prettier over the TypeScript and JavaScript sources (.prettierrc.json,
        # .prettierignore). It fails on a file that `npm run format` would change,
        # so a review never spends its attention on layout (#510).
        run: npm run format:check

      - name: Build
        # `npm run build` is `tsc -b && vite build`, so this type-checks (a bare
        # `tsc --noEmit` against the solution-style root tsconfig — "files": [] —
        # would check zero files) AND produces the real artifact. Without the
        # bundler step, a bad asset reference or chunk-group drift passes PR
        # checks and only fails later, during the deploy on main.
        run: npm run build

      - name: Bundle size budget
        # gzip size per chunk against the budgets in the script. Vite only
        # warns past 500 kB, and a warning on every build is read by no one.
        run: node scripts/check-bundle-size.mjs

      - name: Entry graph
        # The budgets are per chunk, plus a sum over the initial load; none of
        # them says which chunks load at startup. This fails if dist/index.html
        # or the entry's static imports reach the Monaco chunk, which must stay
        # lazy (#467: a code-splitting group once pulled it into every first
        # load while each chunk stayed inside its budget).
        run: node scripts/check-entry-graph.mjs

      # Every relative link in every Markdown file resolves, the ADR index
      # in docs/adr/README.md agrees with the directory and is in order, and
      # the README keeps to readmeMaxLines in .docs-check.json.
      # src/__tests__/docs.test.ts checks the script list in
      # docs/development.md as well; this covers the files that test does not
      # read.
      - name: Documentation links and the ADR index
        uses: Bimmiest/shared-workflows/.github/actions/docs-check@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0

      # Every production dependency's licence is on .licence-allowlist.json,
      # read from the lockfile, so it needs no network and sees exactly what
      # `npm ci --omit=dev` installs. The MCP server's lockfile is checked in
      # its own job.
      - name: Production dependency licences
        uses: Bimmiest/shared-workflows/.github/actions/licence-check@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: Bimmiest/shared-workflows/.github/actions/setup-node-project@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0
        with:
          cache-dependency-path: |
            package-lock.json
            packages/mcp-server/package-lock.json

      - name: Install MCP server dependencies
        # The ESLint tests lint files under packages/mcp-server with the
        # type-aware config; see the static job.
        run: npm ci --ignore-scripts --prefix packages/mcp-server

      - name: Verify the regex engine's WebAssembly
        run: node scripts/check-wasm-checksum.mjs

      - name: Test
        # --coverage rather than a bare `vitest run`: the thresholds live in
        # vitest.config.ts, so this is the same verdict `npm run test:coverage`
        # gives locally, and the floor is a ratchet rather than a suggestion.
        run: npm run test:coverage

      - name: Coverage floors are tight
        # vitest enforces actual >= floor; this enforces the other half. A floor
        # more than 3 points under the measured figure is not a ratchet (#506):
        # coverage could fall by that much unnoticed. It reads the config's
        # thresholds, per-directory ones included, and
        # coverage/coverage-summary.json from the step above. Three points of
        # slack rather than the shared default of one, because each floor here
        # is the measured figure minus one point (see vitest.config.ts) and the
        # MCP server's must hold on its Windows and macOS legs too.
        uses: Bimmiest/shared-workflows/.github/actions/coverage-ratchet@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0
        with:
          slack: '3'

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: Bimmiest/shared-workflows/.github/actions/setup-node-project@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0

      - name: Verify the regex engine's WebAssembly
        run: node scripts/check-wasm-checksum.mjs

      # Chromium only — the e2e suite covers browser-level wiring (CSP, worker
      # bundling, Monaco's chunk split), not cross-browser rendering, so the
      # other engines would cost minutes to re-assert the same facts. The
      # shared action caches the ~130MB download on the resolved
      # @playwright/test version, so a bump invalidates it on its own, and
      # installs the apt packages either way.
      - name: Playwright browser
        uses: Bimmiest/shared-workflows/.github/actions/playwright-browser@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0

      - name: End-to-end smoke tests
        id: e2e
        # Runs against a production build. Guards the things vitest cannot
        # reach: the Content-Security-Policy, the pipeline Web Worker
        # round-trip, and that Monaco actually mounts.
        #
        # The Playwright webServer builds first, so the suite tests this
        # commit's dist/ and never a stale one. This job has no Build step of
        # its own to skip that for.
        run: npm run test:e2e

      - name: Upload Playwright report
        # Scoped to the e2e step rather than the job. A bare `failure()` also
        # fires when an earlier step failed, where no report was ever written —
        # that upload finds nothing, warns, and leaves a misleading empty
        # artifact link.
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The required check. Skipped counts as passed for dependency-review alone,
  # which runs on pull requests only; any other job that did not succeed fails
  # this one.
  ci:
    needs: [static, unit, e2e, mcp-server, workflow-lint, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or (.key == "dependency-review" and .value.result == "skipped"))' > /dev/null

  # The MCP server is a separate package with its own lockfile and toolchain
  # (esbuild, no browser), so it gets its own job rather than riding the app's:
  # its verdict should not be buried under an e2e failure, nor the app's under
  # a worker-thread one. `npm test` builds first (pretest), so this covers
  # typecheck + bundle + the sandbox-timeout tests in one step.
  #
  # It runs on all three desktop platforms (#518): the package is what people
  # install and start on their own machines, where path separators, the
  # worker-thread spawn and the wasm load differ from the runner Linux. The
  # tests that only hold on Linux guard themselves, so a leg skips rather than
  # fails on them. The Linux leg keeps the job's original name, so a required
  # status check of that name still resolves; the others are new checks.
  mcp-server:
    name: ${{ matrix.os == 'ubuntu-latest' && 'mcp-server' || format('mcp-server ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform's failure must not hide the verdicts of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No root install: the package declares the engine's one dependency,
      # pcre2-wasm-utf16, itself, and its build resolves the engine's import
      # to that copy. Installing only the package is what proves it.
      # --ignore-scripts for the reason given in the app's job above. The
      # action's steps take their own working directory, not the job's default.
      - uses: Bimmiest/shared-workflows/.github/actions/setup-node-project@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0
        with:
          cache-dependency-path: packages/mcp-server/package-lock.json
          working-directory: packages/mcp-server

      - name: Verify the regex engine's WebAssembly
        # The package's build checks it too (build:regex-engine, which the
        # Test step's pretest runs); a step of its own names the failure. In
        # Node rather than sha256sum, which the Windows and macOS runners lack
        # or spell differently.
        run: node ../../scripts/check-wasm-checksum.mjs

      - name: Test
        # With the coverage floor in vitest.config.mts, as the app's Test step.
        run: npm run test:coverage

      - name: Coverage floors are tight
        # As the app's job: the floors in vitest.config.mts must stay within 3
        # points of the measured figures. Linux only, because the figures are
        # Linux's: the launcher tests skip elsewhere, so the floors are set for
        # the lowest leg and the others sit further above them.
        if: matrix.os == 'ubuntu-latest'
        uses: Bimmiest/shared-workflows/.github/actions/coverage-ratchet@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0
        with:
          config: vitest.config.mts
          slack: '3'
          working-directory: packages/mcp-server

      - name: Production dependency licences
        # The server's own lockfile and allowlist: these are the packages that
        # run on the machine of whoever starts it. Linux only, because the
        # lockfile is the same on every leg.
        if: matrix.os == 'ubuntu-latest'
        uses: Bimmiest/shared-workflows/.github/actions/licence-check@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0
        with:
          working-directory: packages/mcp-server

  # The default run is deterministic on purpose: one timezone, one locale, a
  # fixed order, and property-test seeds that FC_SEED can pin. That is what
  # makes a red run reproducible, and it is also what lets a test that only
  # passes under those conditions stay green forever (#507). Once a week the
  # unit suite runs the other way: a zone that is neither UTC nor the runner's,
  # a non-English locale, files and tests in a random order, and a fresh FC_SEED
  # so property tests draw new inputs (unset would not: fcSeed() then returns
  # each test's fixed default, #513). The vitest config is used as is, without
  # the coverage floor, which is not a property of the ordering. The step prints
  # the seed and the command that replays the run.
  #
  # The name carries no matrix expression: GitHub appends the matrix values
  # itself on a run, and on a pull request, where the job is skipped before the
  # matrix expands, an expression in the name is shown unevaluated.
  randomised:
    if: github.event_name == 'schedule'
    name: unit tests, randomised
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - tz: America/Los_Angeles
            lang: de_DE.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: Bimmiest/shared-workflows/.github/actions/setup-node-project@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0

      - name: Verify the regex engine's WebAssembly
        run: node scripts/check-wasm-checksum.mjs

      - name: Test
        # fcSeed() returns a test's fixed default whenever FC_SEED is unset, so
        # leaving it unset randomises nothing (#513): every property ran on its
        # committed seed and this job only varied the order. The seed is drawn
        # here instead, and printed where a failure's reader will see it, along
        # with the command that replays the run. It also seeds the file and test
        # order, so one number reproduces both. Vitest and fast-check each print
        # their own seed on a failure too.
        env:
          TZ: ${{ matrix.tz }}
          LANG: ${{ matrix.lang }}
        run: |
          seed=$(( (RANDOM << 15) | RANDOM ))
          echo "Seed: $seed. Replay: FC_SEED=$seed TZ=$TZ LANG=$LANG npx vitest run --sequence.shuffle --sequence.seed=$seed" | tee -a "$GITHUB_STEP_SUMMARY"
          FC_SEED="$seed" npx vitest run --sequence.shuffle --sequence.seed="$seed"

  # The workflows are code too, and the deploy one holds a token. actionlint
  # catches what GitHub would only reject at run time (bad expressions, unknown
  # inputs, shellcheck findings in `run:` blocks); zizmor catches what GitHub
  # happily runs (template injection, persisted credentials, unpinned or
  # impostor action refs). zizmor also reads dependabot.yml.
  #
  # A local job, not shared-workflows' workflow-lint.yml (which runs the same
  # two steps at the same versions), because of the check's name: main's
  # ruleset and scripts/lib/branchProtection.mjs require `workflow-lint`, and a
  # reusable workflow reports as `workflow-lint / workflow-lint` (#602).
  # Moving to it means changing both in the same step.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: actionlint
        # Built from a tagged module version rather than fetched by a download
        # script: the Go checksum database pins the source, so this version
        # cannot change under us. The runner image ships Go and shellcheck;
        # GOTOOLCHAIN=auto fetches a newer Go if the module needs one.
        env:
          ACTIONLINT_VERSION: v1.7.12
          GOTOOLCHAIN: auto
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          "$(go env GOPATH)/bin/actionlint" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          # An exact version, which the action maps to an image digest. `latest`
          # would let a new zizmor audit fail an unrelated PR, the trap that
          # audit.yml's header describes. Raise it when the action's pin moves.
          version: 1.30.1
          # Findings as PR annotations and a failed step, not a SARIF upload:
          # that needs `security-events: write`, and nothing else here does.
          advanced-security: false
          annotations: true

  # npm audit reads the lockfile's registry packages after they merge. This
  # reads the PR's dependency diff from the dependency graph, across both
  # lockfiles, and refuses a newly added advisory before it lands.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The same bar as the audit job's production gate.
          fail-on-severity: high

  # A failed scheduled run opens an issue, or comments on the open one
  # (#573). See environment.yml's `report` job.
  report:
    needs: [ci, randomised]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: Bimmiest/shared-workflows/.github/actions/open-or-update-issue@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0
        with:
          label: scheduled-ci
          title: The weekly CI run failed
          body: |
            Nothing was pushed, so the cause is the runner image, a dependency, or the randomised job's timezone, locale, order or seed. The randomised job prints the command that replays it.

            Run: {run}
