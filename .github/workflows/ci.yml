name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The audit job gates on advisories, and advisories appear against
  # dependencies nobody has touched. With only push/pull_request triggers it
  # runs when someone happens to commit, so a critical advisory can sit
  # unreported for as long as main is quiet. The weekly run is also the only
  # thing that re-exercises the suite against a current runner image, which is
  # where toolchain drift shows up first.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only unless a job asks for more. Nothing here needs the token: the
# Playwright `github` reporter writes its annotations through workflow
# commands on stdout, not the API.
permissions:
  contents: read

# Three pushes to a PR currently grade the same final commit three times, and
# only the last verdict is ever read. Superseded runs are cancelled — except on
# main, where each push is a distinct commit whose status stands on its own
# (and whose green run is what the deploy is judged against).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # The webServer has its own 180s timeout, but nothing bounds a wedged
    # browser or a hung install; without this the ceiling is six hours.
    timeout-minutes: 20
    steps:
      # Nothing in these jobs talks to the remote after checkout, and they
      # run dependency code that has no business finding a token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Kept in step with .nvmrc and package.json "engines". The pin tracks
          # Active LTS rather than latest, and the two failure modes it steers
          # between have both bitten here: CI once built on an end-of-life Node
          # 20 while .nvmrc pinned a non-LTS 25.x, so neither matched the other
          # nor what the deploy ran. 22 entered maintenance in October 2025,
          # which puts the actively supported line at 24 until October 2026.
          node-version-file: .nvmrc
          cache: npm
          # Both lockfiles: this job installs the MCP server's deps too (see
          # the lint step), so its lockfile belongs in the cache key.
          cache-dependency-path: |
            package-lock.json
            packages/mcp-server/package-lock.json

      # --ignore-scripts, as the deploy build installs (azure-static-web-apps.yml):
      # CI must test the tree that ships, not one that also ran install scripts.
      # Nothing here needs them. The only lockfile entries with an install
      # script are fsevents (macOS-only, optional) and, in the MCP server's,
      # esbuild, whose postinstall only verifies the platform binary and swaps
      # a launcher shim for it; the binary arrives through optionalDependencies
      # and the package works without the swap. pcre2-wasm-utf16 is prebuilt
      # and has no install or prepare script.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install MCP server dependencies
        # Lint below is type-aware over the whole repo (projectService), and
        # packages/mcp-server resolves @modelcontextprotocol/sdk and zod from
        # its own node_modules. Without this install those types don't
        # resolve, and every use reports as an unsafe `any`.
        run: npm ci --ignore-scripts --prefix packages/mcp-server

      - name: Verify the regex engine's WebAssembly
        # pcre2-wasm-utf16 is a git dependency: the lockfile pins its commit
        # but records no integrity hash, and npm audit cannot see it. The
        # package ships the checksum its build produced; a binary that does not
        # match it is not the one upstream built and published. Both installed
        # copies are checked: the app's, which ships, and the MCP server's.
        # Every job that installs the package runs this (mcp-server and
        # mutation below, the deploy build too), #504.
        run: |
          node scripts/check-wasm-checksum.mjs
          node scripts/check-wasm-checksum.mjs packages/mcp-server

      - name: Lint
        run: npm run lint

      - name: Build
        # `npm run build` is `tsc -b && vite build`, so this type-checks (a bare
        # `tsc --noEmit` against the solution-style root tsconfig — "files": [] —
        # would check zero files) AND produces the real artifact. Without the
        # bundler step, a bad asset reference or chunk-group drift passes PR
        # checks and only fails later, during the deploy on main.
        run: npm run build

      - name: Bundle size budget
        # gzip size per chunk against the budgets in the script. Vite only
        # warns past 500 kB, and a warning on every build is read by no one.
        run: node scripts/check-bundle-size.mjs

      - name: Entry graph
        # The budgets are per chunk, plus a sum over the initial load; none of
        # them says which chunks load at startup. This fails if dist/index.html
        # or the entry's static imports reach the Monaco chunk, which must stay
        # lazy (#467: a code-splitting group once pulled it into every first
        # load while each chunk stayed inside its budget).
        run: node scripts/check-entry-graph.mjs

      - name: Test
        # --coverage rather than a bare `vitest run`: the thresholds live in
        # vitest.config.ts, so this is the same verdict `npm run test:coverage`
        # gives locally, and the floor is a ratchet rather than a suggestion.
        run: npm run test:coverage

      - name: Coverage floors are tight
        # vitest enforces actual >= floor; this enforces the other half. A floor
        # more than 3 points under the measured figure is not a ratchet (#506):
        # coverage could fall by that much unnoticed. It reads the config's
        # thresholds and coverage/coverage-summary.json from the step above.
        run: node scripts/check-coverage-floors.mjs

      # Chromium only — the e2e suite covers browser-level wiring (CSP, worker
      # bundling, Monaco's chunk split), not cross-browser rendering, so the
      # other engines would cost minutes to re-assert the same facts.
      #
      # The download is ~130MB and `--with-deps` shells out to apt, every run,
      # for a browser that only changes when @playwright/test does. Keying the
      # cache on the resolved version means a bump invalidates it on its own;
      # the apt packages live outside ~/.cache so they are reinstalled either
      # way.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end smoke tests
        id: e2e
        # Runs against a production build. Guards the things vitest cannot
        # reach: the Content-Security-Policy, the pipeline Web Worker
        # round-trip, and that Monaco actually mounts.
        #
        # E2E_SKIP_BUILD suppresses the rebuild the Playwright webServer does by
        # default. That rebuild exists so a stale dist/ can never be what gets
        # tested, which is the right default — but here the Build step above ran
        # against this same commit minutes ago, so it would rebuild identical
        # output. Setting the flag is the caller asserting the artifact is
        # fresh; anywhere that assertion does not hold, leave it unset.
        env:
          E2E_SKIP_BUILD: '1'
        run: npm run test:e2e

      - name: Upload Playwright report
        # Scoped to the e2e step rather than the job. A bare `failure()` also
        # fires when lint failed, where no report was ever written — that upload
        # finds nothing, warns, and leaves a misleading empty artifact link.
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # The MCP server is a separate package with its own lockfile and toolchain
  # (esbuild, no browser), so it gets its own job rather than riding the app's:
  # its verdict should not be buried under an e2e failure, nor the app's under
  # a worker-thread one. `npm test` builds first (pretest), so this covers
  # typecheck + bundle + the sandbox-timeout tests in one step.
  #
  # It runs on all three desktop platforms (#518): the package is what people
  # install and start on their own machines, where path separators, the
  # worker-thread spawn and the wasm load differ from the runner Linux. The
  # tests that only hold on Linux guard themselves, so a leg skips rather than
  # fails on them. The Linux leg keeps the job's original name, so a required
  # status check of that name still resolves; the others are new checks.
  mcp-server:
    name: ${{ matrix.os == 'ubuntu-latest' && 'mcp-server' || format('mcp-server ({0})', matrix.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform's failure must not hide the verdicts of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json

      # No root install: the package declares the engine's one dependency,
      # pcre2-wasm-utf16, itself, and its build resolves the engine's import
      # to that copy. Installing only the package is what proves it.
      # --ignore-scripts for the reason given in the app's job above.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify the regex engine's WebAssembly
        # The package's build checks it too (build:regex-engine, which the
        # Test step's pretest runs); a step of its own names the failure. In
        # Node rather than sha256sum, which the Windows and macOS runners lack
        # or spell differently.
        run: node ../../scripts/check-wasm-checksum.mjs

      - name: Test
        # With the coverage floor in vitest.config.mts, as the app's Test step.
        run: npm run test:coverage

      - name: Coverage floors are tight
        # As the app's job: the floors in vitest.config.mts must stay within 3
        # points of the measured figures. Linux only, because the figures are
        # Linux's: the launcher tests skip elsewhere, so the floors are set for
        # the lowest leg and the others sit further above them.
        if: matrix.os == 'ubuntu-latest'
        run: node ../../scripts/check-coverage-floors.mjs vitest.config.mts

  # The default run is deterministic on purpose: one timezone, one locale, a
  # fixed order, and property-test seeds that FC_SEED can pin. That is what
  # makes a red run reproducible, and it is also what lets a test that only
  # passes under those conditions stay green forever (#507). Once a week the
  # unit suite runs the other way: a zone that is neither UTC nor the runner's,
  # a non-English locale, files and tests in a random order, and FC_SEED left
  # unset so property tests draw fresh seeds. The vitest config is used as is,
  # without the coverage floor, which is not a property of the ordering. Vitest
  # and fast-check both report the seed that reproduces a failure.
  randomised:
    if: github.event_name == 'schedule'
    name: ${{ format('unit tests, randomised ({0}, {1})', matrix.tz, matrix.lang) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - tz: America/Los_Angeles
            lang: de_DE.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify the regex engine's WebAssembly
        run: node scripts/check-wasm-checksum.mjs

      - name: Test
        # FC_SEED is deliberately not set anywhere in this job.
        env:
          TZ: ${{ matrix.tz }}
          LANG: ${{ matrix.lang }}
        run: npx vitest run --sequence.shuffle

  # Split out of the main job on purpose. Sequentially, a new advisory turned
  # the whole run red after five minutes of tests, and the tests' own verdict
  # was lost behind it — the two ask unrelated questions and should be able to
  # fail independently. It also means a fresh advisory is reported in seconds
  # rather than behind the e2e suite.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          # No `cache: npm` and no `npm ci`: npm audit resolves the tree from
          # package-lock.json, so installing would only buy a slower job.

      - name: Audit production dependencies
        # Production deps are what ship to the browser, so they gate the build.
        run: npm audit --omit=dev --audit-level=high

      - name: Report dev-only advisories
        # Reported, never fatal: a CVE in a build tool must not be able to block
        # a fix for something users are actually hitting.
        run: npm audit --audit-level=high || true

      # `npm audit` resolves exactly one lockfile — the one for the tree it is
      # pointed at — so the two steps above say nothing whatsoever about
      # packages/mcp-server, which carries its own; these steps audit that one.
      - name: Audit the MCP server's production dependencies
        # Same gate as the app's, for the same reason: these are what run on the
        # machine of whoever starts the server, and the process they run in
        # holds whatever the agent driving it can reach.
        working-directory: packages/mcp-server
        run: npm audit --omit=dev --audit-level=high

      - name: Report the MCP server's dev-only advisories
        working-directory: packages/mcp-server
        run: npm audit --audit-level=high || true

  # The workflows are code too, and the deploy one holds a token. actionlint
  # catches what GitHub would only reject at run time (bad expressions, unknown
  # inputs, shellcheck findings in `run:` blocks); zizmor catches what GitHub
  # happily runs (template injection, persisted credentials, unpinned or
  # impostor action refs). zizmor also reads dependabot.yml.
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: actionlint
        # Built from a tagged module version rather than fetched by a download
        # script: the Go checksum database pins the source, so this version
        # cannot change under us. The runner image ships Go and shellcheck;
        # GOTOOLCHAIN=auto fetches a newer Go if the module needs one.
        env:
          ACTIONLINT_VERSION: v1.7.12
          GOTOOLCHAIN: auto
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@$ACTIONLINT_VERSION"
          "$(go env GOPATH)/bin/actionlint" -color

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # An exact version, which the action maps to an image digest. `latest`
          # would let a new zizmor audit fail an unrelated PR, the trap the
          # audit job's comment describes. Raise it when the action's pin moves.
          version: 1.30.1
          # Findings as PR annotations and a failed step, not a SARIF upload:
          # that needs `security-events: write`, and nothing else here does.
          advanced-security: false
          annotations: true

  # npm audit reads the lockfile's registry packages after they merge. This
  # reads the PR's dependency diff from the dependency graph, across both
  # lockfiles, and refuses a newly added advisory before it lands.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # The same bar as the audit job's production gate.
          fail-on-severity: high
