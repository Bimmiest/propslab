name: Mutation

# Coverage says a line ran; it does not say a test would notice if the line were
# wrong. Stryker answers that second question by breaking src/engine/** one small
# edit at a time and checking that some test fails. A full run takes over four
# hours of work, so it lives here rather than in ci.yml, is divided across the
# jobs of a matrix, and pull requests mutate only the engine files they change.
on:
  # The whole engine, from scratch, in shards whose combined score is held to
  # the floor in stryker.config.mjs (the `score` job). Later in the morning
  # than ci.yml's weekly run so the two do not share a queue. The full run
  # includes the static mutants (#857): see `ignoreStatic` in stryker.config.mjs.
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      # On, as in the weekly run. Off gives the time and the score of a full
      # run without the static mutants, to compare.
      static:
        description: Include the static mutants (MUTATION_STATIC=1), as the weekly run does
        type: boolean
        default: true
  # Only the engine source files the PR changes are mutated, so the check costs
  # minutes whatever else is going on. Nothing is cached between runs: a PR's
  # cost never depends on how recently something else ran.
  pull_request:
    branches: [main]
    # Wide on purpose (#571): the scope is stryker.config.mjs's `mutate`,
    # which "Find changed engine files" reads, so it is written in one place.
    # A PR that changes nothing in it stops after that step, before the MCP
    # build and the canary.
    paths:
      - 'src/**'
      - 'packages/mcp-server/src/**'
      - 'scripts/**'
      - 'stryker.config.mjs'
      - 'vitest.config.ts'
      - 'vitest.stryker.config.ts'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read

# Same rule as ci.yml: supersede on PRs, never on main.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  mutation:
    runs-on: ubuntu-latest
    strategy:
      # A shard that fails must not cancel the others: their reports still name
      # the mutants that survived.
      fail-fast: false
      matrix:
        # A full run was one job, and it grew past every limit it was given:
        # 120, 180, 240 and 300 minutes (#571), and 254 minutes on 2026-11-09.
        # GitHub stops a job at 6 hours, so the full run is divided into shards
        # (#851). scripts/mutation-shard.mjs gives each shard about the same
        # share of the `mutate` list, by file size. To add a shard, add a number.
        # A pull request mutates only what it changed, in one job: shard 0.
        shard: ${{ fromJSON(github.event_name == 'pull_request' && '[0]' || '[1, 2, 3, 4]') }}
    # Measured on 2026-11-11: four shards without the static mutants took 25 to
    # 40 minutes each, and the static mutants add about 40 minutes of work in
    # all (#857), so a shard takes about 45 to 55. When a shard gets near its
    # limit, add a shard; do not raise the limit.
    #
    # A PR run mutates the files it changes, and the sources its changed tests
    # import. A test-only change to a property suite brings the parser it
    # imports: #723's property suites brought 3,621 mutants and were two-thirds
    # through at 48 minutes, so a PR gets 90.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 90 || 150 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR diff needs the merge base with main.
          fetch-depth: 0
          # That diff reads refs this full-history checkout already fetched;
          # nothing talks to the remote afterwards, so the token is not kept.
          persist-credentials: false

      # Node from .nvmrc and `npm ci --ignore-scripts`, as in ci.yml and the
      # deploy build: the same tree is tested everywhere. See ci.yml for why
      # nothing here needs install scripts.
      - uses: Bimmiest/shared-workflows/.github/actions/setup-node-project@171cd386717395c01be5e23ab926823c7b246cf6 # v1.11.0
        with:
          cache-dependency-path: |
            package-lock.json
            packages/mcp-server/package-lock.json

      # The scope is stryker.config.mjs's `mutate` list, read by
      # scripts/mutation-targets.mjs, so it is written in one place (#571).
      # Deleted files have nothing to mutate, so only added and modified ones
      # count, and renames are off, so a renamed and edited file counts too.
      # A changed test file brings the source files it imports: the PR changed
      # how those are tested, and only the weekly run would notice otherwise.
      - name: Find changed engine files
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          targets=$(node scripts/mutation-targets.mjs "origin/$BASE_REF")
          files=$(sed -n 's/^changed=//p' <<<"$targets")
          tested=$(sed -n 's/^tested=//p' <<<"$targets")
          # A reformat touches every file and changes nothing a mutant could
          # test, and neither does a comment edit: the files whose change is
          # formatting or comments only are dropped, each named in the summary.
          # The tested files did not change, so they are not filtered.
          if [ -n "$files" ]; then
            files=$(node scripts/drop-format-only.mjs "origin/$BASE_REF" "$files" 2>> "$GITHUB_STEP_SUMMARY")
          fi
          if [ -n "$tested" ]; then
            echo "Also mutating what the changed tests import: \`$tested\`" >> "$GITHUB_STEP_SUMMARY"
            files=$(printf '%s,%s' "$files" "$tested" | tr ',' '\n' | grep -v '^$' | paste -sd, -)
          fi
          # A PR that only touches the mutation setup (Stryker or vitest config,
          # this workflow) still proves it works: one small, well-tested file.
          if [ -z "$files" ]; then
            config=$(git diff --name-only "origin/$BASE_REF...HEAD" -- stryker.config.mjs vitest.config.ts vitest.stryker.config.ts .github/workflows/mutation.yml \
              scripts/mutation-targets.mjs scripts/drop-format-only.mjs scripts/lib/mutationTargets.mjs scripts/lib/formatOnly.mjs)
            if [ -n "$config" ]; then
              files=src/engine/utils/fieldRef.ts
              echo "Mutation setup changed; smoke run on \`$files\`." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No mutable engine source changed; the weekly full run covers the rest." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "${config:-}" ]; then
            echo "Mutating: \`$files\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The run includes the MCP server's tests for the modules it mutates
      # there, and Stryker's first pass runs every included test: they import
      # the package's SDK, and one of them spawns the built server.
      - name: Install and build the MCP server
        if: github.event_name != 'pull_request' || steps.changed.outputs.files != ''
        run: |
          npm ci --ignore-scripts --prefix packages/mcp-server
          npm run build --prefix packages/mcp-server

      - name: Verify the regex engine's WebAssembly
        if: github.event_name != 'pull_request' || steps.changed.outputs.files != ''
        # Both installed copies, as in ci.yml (#504): the mutation run executes
        # the engine on a binary that nothing else here has vouched for.
        run: |
          node scripts/check-wasm-checksum.mjs
          node scripts/check-wasm-checksum.mjs packages/mcp-server

      # One small, well-tested file, mutated first. Stryker hands vitest a
      # test-name filter for each mutant; if a vitest or Stryker upgrade makes the
      # two join names differently, no test runs per mutant, every mutant reads
      # as SURVIVED, and the run only looks like a low score (#508, #796). This
      # fails with the cause named, before the long run starts, on every trigger.
      # It is the check `npm run test:mutation:canary` runs locally.
      - name: Canary (Stryker still runs the tests of each mutant)
        if: github.event_name != 'pull_request' || steps.changed.outputs.files != ''
        run: npm run test:mutation:canary

      # The floor (thresholds.break) applies to the changed files taken
      # together: a PR that touches a weakly tested file adds the tests that
      # bring it up, rather than inheriting its gaps.
      - name: Mutation test (changed files)
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: npm run test:mutation -- --mutate "$FILES"

      # MUTATION_SHARD=1 turns off the floor for one shard: the `score` job
      # applies it to the shards together.
      - name: Mutation test (shard ${{ matrix.shard }} of ${{ strategy.job-total }})
        if: github.event_name != 'pull_request'
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
          MUTATION_SHARD: '1'
          # The schedule has no inputs, so it names itself.
          MUTATION_STATIC: ${{ (github.event_name == 'schedule' || inputs.static) && '1' || '0' }}
        run: |
          files=$(node scripts/mutation-shard.mjs "$SHARDS" "$SHARD")
          echo "Shard $SHARD of $SHARDS mutates $(tr ',' '\n' <<<"$files" | wc -l) files: \`$files\`" >> "$GITHUB_STEP_SUMMARY"
          start=$SECONDS
          npm run test:mutation -- --mutate "$files"
          echo "Shard $SHARD of $SHARDS took $(( (SECONDS - start) / 60 )) minutes." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload mutation report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || steps.changed.outputs.files != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # The `score` job finds the shards' reports by this name.
          name: ${{ matrix.shard == 0 && 'mutation-report' || format('mutation-report-{0}-of-{1}', matrix.shard, strategy.job-total) }}
          path: reports/mutation/
          retention-days: 14

  # The floor for the full run: the shards' reports scored together. It runs
  # only when every shard finished, and fails when a report is missing.
  score:
    needs: [mutation]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The check reads stryker.config.mjs and scripts/ only: no install.
      - uses: Bimmiest/shared-workflows/.github/actions/setup-node-project@171cd386717395c01be5e23ab926823c7b246cf6 # v1.11.0
        with:
          install: 'false'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutation-report-*-of-*
          path: reports/shards

      - name: Combined score against the floor
        run: node scripts/check-mutation-score.mjs reports/shards >> "$GITHUB_STEP_SUMMARY"

  # A failed scheduled run opens an issue, or comments on the open one
  # (#573). See environment.yml's `report` job. A shard that hits its timeout
  # ends `cancelled`, not `failure`, and then `score` is skipped, so
  # `failure()` alone would stay false and no issue would open (#889).
  report:
    needs: [mutation, score]
    if: >-
      !cancelled() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: Bimmiest/shared-workflows/.github/actions/open-or-update-issue@171cd386717395c01be5e23ab926823c7b246cf6 # v1.11.0
        with:
          label: scheduled-mutation
          title: The scheduled mutation run failed
          body: |
            The full run scored under the floor in stryker.config.mjs, or a shard did not finish. The report artifact of each shard lists its surviving mutants.

            Run: {run}
