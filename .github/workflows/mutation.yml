name: Mutation

# Coverage says a line ran; it does not say a test would notice if the line were
# wrong. Stryker answers that second question by breaking src/engine/** one small
# edit at a time and checking that some test fails. A full run takes over an
# hour, so it lives here rather than in ci.yml, and pull requests mutate only
# the engine files they change.
on:
  # The whole engine, from scratch, held to the floor in stryker.config.mjs.
  # Later in the morning than ci.yml's weekly run so the two do not share a queue.
  #
  # The second schedule is the monthly run that includes static mutants (see the
  # "static mutants" step). The `if:` conditions below tell the two apart by this
  # exact string, so change them together.
  schedule:
    - cron: '0 8 * * 1'
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      static:
        description: 'Include static mutants (module-level constants): about three hours, reported but not gated'
        type: boolean
        default: false
  # Only the engine source files the PR changes are mutated, so the check costs
  # minutes whatever else is going on. Nothing is cached between runs: a PR's
  # cost never depends on how recently something else ran.
  pull_request:
    branches: [main]
    paths:
      - 'src/engine/**'
      - 'src/utils/strftime.ts'
      - 'src/utils/splunkRegex.ts'
      - 'packages/mcp-server/src/requestId.ts'
      - 'packages/mcp-server/src/messageLimit.ts'
      - 'packages/mcp-server/src/serialize.ts'
      - 'src/workers/workerLifecycle.ts'
      - 'src/workers/workerProtocol.ts'
      - 'src/store/**'
      # Their tests, which a PR can change alone: the run then mutates what
      # the changed tests import (scripts/mutation-targets.mjs).
      - 'src/utils/__tests__/**'
      - 'src/hooks/__tests__/**'
      - 'src/workers/__tests__/**'
      - 'packages/mcp-server/src/__tests__/**'
      - 'stryker.config.mjs'
      - 'scripts/check-mutation-canary.mjs'
      - 'scripts/mutation-targets.mjs'
      - 'scripts/drop-format-only.mjs'
      - 'scripts/lib/mutationTargets.mjs'
      - 'scripts/lib/formatOnly.mjs'
      - 'vitest.config.ts'
      - 'vitest.stryker.config.ts'
      - '.github/workflows/mutation.yml'

permissions:
  contents: read

# Same rule as ci.yml: supersede on PRs, never on main.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  mutation:
    runs-on: ubuntu-latest
    # A full run measured 76 minutes on a standard 4-core runner when the
    # limit was set. By 2026-10-19 it was 12,713 mutants and had reached 82%
    # at the 120-minute limit (two weekly runs cancelled), so the weekly limit
    # is 180: the projected 2h25m plus room to grow. A PR run mutates a handful
    # of files; if one outgrows 30 minutes, the PR is changing more of the
    # engine at once than this check was sized for. The static-mutant run is
    # past three hours (stryker.config.mjs says why).
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || (github.event.schedule == '0 9 1 * *' || inputs.static) && 330 || 180 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The PR diff needs the merge base with main.
          fetch-depth: 0
          # That diff reads refs this full-history checkout already fetched;
          # nothing talks to the remote afterwards, so the token is not kept.
          persist-credentials: false

      # Node from .nvmrc and `npm ci --ignore-scripts`, as in ci.yml and the
      # deploy build: the same tree is tested everywhere. See ci.yml for why
      # nothing here needs install scripts.
      - uses: Bimmiest/shared-workflows/.github/actions/setup-node-project@5f68ca4788224cfb9fd210be687f9c00f7284b4a # v1.3.1
        with:
          cache-dependency-path: |
            package-lock.json
            packages/mcp-server/package-lock.json

      # The run includes the MCP server's tests for the modules it mutates
      # there, and Stryker's first pass runs every included test: they import
      # the package's SDK, and one of them spawns the built server.
      - name: Install and build the MCP server
        run: |
          npm ci --ignore-scripts --prefix packages/mcp-server
          npm run build --prefix packages/mcp-server

      - name: Verify the regex engine's WebAssembly
        # Both installed copies, as in ci.yml (#504): the mutation run executes
        # the engine on a binary that nothing else here has vouched for.
        run: |
          node scripts/check-wasm-checksum.mjs
          node scripts/check-wasm-checksum.mjs packages/mcp-server

      # One small, well-tested file, mutated first. vitest.stryker.config.ts
      # patches the test-name filter Stryker hands vitest; if a vitest or Stryker
      # upgrade breaks the patch, no test runs per mutant, every mutant reads as
      # SURVIVED, and the run only looks like a low score (#508). This fails with
      # the cause named, before the long run starts, on every trigger. It is the
      # check `npm run test:mutation:canary` runs locally.
      - name: Canary (the test-name shim still filters correctly)
        run: npm run test:mutation:canary

      # The scope is stryker.config.mjs's `mutate` list, read by
      # scripts/mutation-targets.mjs, so it is written in one place (#571).
      # Deleted files have nothing to mutate, so only added and modified ones
      # count, and renames are off, so a renamed and edited file counts too.
      # A changed test file brings the source files it imports: the PR changed
      # how those are tested, and only the weekly run would notice otherwise.
      - name: Find changed engine files
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          targets=$(node scripts/mutation-targets.mjs "origin/$BASE_REF")
          files=$(sed -n 's/^changed=//p' <<<"$targets")
          tested=$(sed -n 's/^tested=//p' <<<"$targets")
          # A reformat touches every file and changes nothing a mutant could
          # test, and neither does a comment edit: the files whose change is
          # formatting or comments only are dropped, each named in the summary.
          # The tested files did not change, so they are not filtered.
          if [ -n "$files" ]; then
            files=$(node scripts/drop-format-only.mjs "origin/$BASE_REF" "$files" 2>> "$GITHUB_STEP_SUMMARY")
          fi
          if [ -n "$tested" ]; then
            echo "Also mutating what the changed tests import: \`$tested\`" >> "$GITHUB_STEP_SUMMARY"
            files=$(printf '%s,%s' "$files" "$tested" | tr ',' '\n' | grep -v '^$' | paste -sd, -)
          fi
          # A PR that only touches the mutation setup (Stryker or vitest config,
          # this workflow) still proves it works: one small, well-tested file.
          if [ -z "$files" ]; then
            config=$(git diff --name-only "origin/$BASE_REF...HEAD" -- stryker.config.mjs vitest.config.ts vitest.stryker.config.ts .github/workflows/mutation.yml \
              scripts/mutation-targets.mjs scripts/drop-format-only.mjs scripts/lib/mutationTargets.mjs scripts/lib/formatOnly.mjs)
            if [ -n "$config" ]; then
              files=src/engine/utils/fieldRef.ts
              echo "Mutation setup changed; smoke run on \`$files\`." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [ -z "$files" ]; then
            echo "No mutable engine source changed; the weekly full run covers the rest." >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "${config:-}" ]; then
            echo "Mutating: \`$files\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The floor (thresholds.break) applies to the changed files taken
      # together: a PR that touches a weakly tested file adds the tests that
      # bring it up, rather than inheriting its gaps.
      - name: Mutation test (changed files)
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        env:
          FILES: ${{ steps.changed.outputs.files }}
        run: npm run test:mutation -- --mutate "$FILES"

      - name: Mutation test (whole engine)
        if: github.event_name != 'pull_request' && github.event.schedule != '0 9 1 * *' && !inputs.static
        run: npm run test:mutation

      # Static mutants change a module-level value (a regex, a lookup table) that
      # is built once at import, so no single test covers them and each reruns
      # the whole suite. There are ~900 of them, in exactly the parser tables and
      # patterns where a wrong edit matters, and the weekly run ignores them for
      # cost (#508). Monthly, they are run. Their score is reported, not gated:
      # the break floor was measured without them, and nobody has yet measured
      # what it should be with them. Once a run has, a floor for this run
      # belongs in stryker.config.mjs. MUTATION_STATIC is what includes them:
      # Stryker's `--ignoreStatic` flag can only turn the option on.
      - name: Mutation test (whole engine, static mutants included)
        if: github.event.schedule == '0 9 1 * *' || inputs.static
        env:
          MUTATION_REPORT_ONLY: '1'
          MUTATION_STATIC: '1'
        run: npm run test:mutation

      - name: Upload mutation report
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || steps.changed.outputs.files != '') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14

  # A failed scheduled run opens an issue, or comments on the open one
  # (#573). See environment.yml's `report` job.
  report:
    needs: [mutation]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: Bimmiest/shared-workflows/.github/actions/open-or-update-issue@5f68ca4788224cfb9fd210be687f9c00f7284b4a # v1.3.1
        with:
          label: scheduled-mutation
          title: The scheduled mutation run failed
          body: |
            The full run scored under the floor in stryker.config.mjs, or did not finish. The report artifact lists the surviving mutants.

            Run: {run}
