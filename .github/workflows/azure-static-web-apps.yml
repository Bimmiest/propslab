name: Azure Static Web Apps CI/CD

# Deploy on CI's verdict, not alongside it: triggered on `push` beside CI, a
# commit that failed lint, the unit suite or the e2e smoke tests would be live
# before CI said so. `workflow_run` starts this only once a CI run has
# *finished*, and the job-level `if` below lets it through only when that run
# passed.
#
# `workflow_run` always executes this file as it stands on the default branch,
# never the copy at the commit being deployed. That is what we want here: a
# branch cannot rewrite the deploy that holds the token. The `branches` filter
# matches the triggering run's head *branch name*, which a fork PR can also
# call `main` — so it narrows the noise, and the `event == 'push'` check in the
# job's `if` is what actually keeps pull requests (and CI's weekly schedule,
# which re-grades a commit that is already live) from deploying.
#
# zizmor flags every `workflow_run` as dangerous because the usual pattern
# checks out and runs the triggering PR's code with a privileged token. This
# one never touches the triggering run's head: it builds the newest commit
# main has contained (see "Resolve commit" and "Refuse commits not on main"),
# and the job that holds the token checks nothing out at all.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Manual redeploys, and the rollback path. Not gated on CI, by design — a
  # rollback is usually needed precisely when main is in a state nobody wants
  # to wait on — but not from any ref. Dispatch it on `main`
  # and name the commit to put back in `sha`; leave `sha` empty to redeploy
  # the newest commit on main with a green push CI, the same one the
  # workflow_run path would pick. The "Refuse commits not on main" step
  # requires the commit to be one main has already contained, which keeps
  # rollback to anything that was ever reviewed and merged and nothing else.
  #
  # A dispatch runs the copy of this file *on the dispatched ref*: were tags
  # allowed, anyone who can push one could put it on an unmerged commit whose
  # copy of this file has no ancestor check, dispatch on it, and reach the
  # token. So the ref a dispatch runs from is always main — whose copy of this
  # file is the reviewed one — and the target commit is data, validated by that copy.
  # The environment admitting `main` and nothing else is what makes that
  # binding; the ref check in the build job only makes the failure readable.
  workflow_dispatch:
    inputs:
      sha:
        description: >-
          Commit to deploy (rollback). Must be on main. Leave empty for the
          newest commit on main whose push CI passed.
        required: false
        default: ''
        type: string

# Deploys are not interchangeable the way CI runs are. Cancelling one mid-upload
# can leave the site serving a partially published artifact, and the run that
# starts last is not reliably the one that finishes last — two quick pushes to
# main could land the older bundle on top of the newer. Queue them instead.
#
# Gating on CI adds a second way to get the order wrong, which the queue alone
# does not fix: CI runs for two pushes can finish in either order, so the
# deploys are *started* out of push order. And a group holds one running and
# one pending run — a newer pending run cancels the older pending one — so the
# run that survives the queue is not necessarily the newest commit's. The
# "Resolve commit" step closes both: each run deploys the newest commit on main
# with a green push CI at the moment it starts, not the commit that happened to
# trigger it. Whichever run survives, it ships the newest green bundle.
#
# Only runs that can deploy join the queue. The group is evaluated before the
# build job's `if`, so a workflow_run that job is bound to skip — CI on a pull
# request (a fork's branch can be called `main`), CI's weekly schedule, a
# manual CI dispatch, a failed CI run — would otherwise join it, displace a
# pending real deploy and then deploy nothing. Such a run gets a group keyed
# on its own run id, so it contends with no one.
#
# The group is at workflow level rather than on a job, so it holds a whole
# run, build and deploy together. Per-job groups would let a newer run build and resolve while an
# older run's deploy was still waiting, and the two uploads could again land
# in either order.
#
# Rollback, and why it needs the DEPLOY_PAUSED switch. On its own the queue
# above works against a rollback in two ways. A dispatch waiting behind a
# running deploy is the group's pending run, so the next CI completion on main
# queues a workflow_run behind it and silently cancels it — newest pending
# wins, whatever the trigger. And a rollback that does run lasts only until
# the next green push CI on main, because the automatic path redeploys the
# newest green commit.
#
# Splitting the triggers into separate groups would not help: the two paths
# would then race each other's uploads, and a shared job-level group on
# `deploy` has the same newest-pending-wins rule, so an automatic deploy job
# could still displace a waiting manual one. Instead, the repository variable
# DEPLOY_PAUSED takes the automatic path out of the queue entirely. While it is
# 'true', a workflow_run run is put in a group of its own, where it can
# displace nothing but another paused automatic run, and its build job's `if`
# skips it, so it deploys nothing either. Dispatches keep the shared group and
# are not affected by the variable, so rollback while paused is the intended
# flow. With it unset, every run that can deploy shares one group, exactly as
# described above.
#
# What that guarantees: a dispatch made *after* DEPLOY_PAUSED is set to 'true'
# is never cancelled by, and never overwritten by, an automatic deploy, for as
# long as the variable stays set. An automatic run queued before the switch
# either finishes first (the dispatch then waits behind it and deploys last)
# or is still pending and is displaced by the dispatch; one that has not
# started its build job by then skips, since the `if` reads the variable
# again. It guarantees nothing for a dispatch made while the variable is
# unset: the rollback will not stick.
#
# Rollback procedure (also in the README and CONTRIBUTING):
#   1. Settings → Secrets and variables → Actions → Variables: set
#      DEPLOY_PAUSED to `true`.
#   2. Dispatch this workflow on main with `sha` = the commit to put back.
#   3. Once the fix is merged and main's push CI is green, delete
#      DEPLOY_PAUSED (or set it to anything but `true`), then dispatch with
#      `sha` empty, or wait for the next push, to resume automatic deploys.
concurrency:
  # The first branch must mirror the build job's `if` for workflow_run: any
  # run that `if` would skip on event or conclusion goes in its own group.
  group: >-
    ${{ github.event_name == 'workflow_run' &&
    (github.event.workflow_run.event != 'push' ||
    github.event.workflow_run.conclusion != 'success') &&
    format('deploy-static-web-app-skip-{0}', github.run_id) ||
    github.event_name == 'workflow_run' && vars.DEPLOY_PAUSED == 'true' &&
    'deploy-static-web-app-paused' || 'deploy-static-web-app' }}
  cancel-in-progress: false

jobs:
  # Lint / type-check / test live in ci.yml; this workflow builds and deploys
  # only, so checks aren't run twice. It runs after CI, never beside it — see
  # the `on:` block above.
  #
  # Build and deploy are separate jobs, so no job that runs repo or dependency
  # code holds the deployment token. Everything that executes repo code
  # happens in `build`, which has no environment and so cannot see the token,
  # and `deploy` only downloads the built `dist/` and hands it to the Azure
  # action. It never checks out the repository at all.
  build:
    # `conclusion` is the whole run's verdict, so every CI job — app, MCP
    # server, audit and workflow lint — has to be green. `event` is the event
    # CI itself ran on; only a push to main is a candidate for production. DEPLOY_PAUSED
    # stops the automatic path only — a dispatch is how you roll back while
    # paused (see the concurrency note). It is read again here, not just
    # in the group expression, so a run queued before the switch was set and
    # still waiting skips when it finally starts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.DEPLOY_PAUSED != 'true' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Build
    # `actions: read` is for the Resolve commit step, which lists CI runs.
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      # A dispatch runs this file as it stands on the dispatched ref, so a
      # branch or tag can supply a copy without this step — this is not the
      # control. The `production` environment's main-only deployment
      # branch rule is, and it refuses such a run's deploy job regardless.
      # This makes the ordinary mistake, dispatching from the wrong ref in the
      # form, fail in the first second with a message that says what to do
      # instead of at the environment gate after a full build.
      - name: Require dispatch from main
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch this workflow on main, not $REF. To roll back, dispatch on main and put the commit in the 'sha' input; it must be a commit main has contained."
            exit 1
          fi

      # Under workflow_run, `github.sha` is the default branch's head when this
      # run was queued — not the commit CI graded, and possibly one CI has not
      # finished with. So the commit is resolved explicitly: the newest push to
      # main whose CI run succeeded (see the concurrency note for why that and
      # not simply `workflow_run.head_sha`). That is at worst the triggering
      # commit itself, which just passed. A failed lookup fails the job rather
      # than falling back: deploying a guess is worse than not deploying.
      #
      # A dispatch with `sha` set deploys that commit — the rollback path. A
      # dispatch without it resolves exactly as workflow_run does. The input
      # reaches the shell through `env`, never interpolated into the script,
      # and must look like a commit hash before anything else touches it; the
      # next steps hold it to commits main has contained.
      #
      # The check is bash's `[[ =~ ]]`, which matches the whole string. A
      # line-oriented check (grep) would pass a multi-line input as long as one
      # line looked like a hash, and write its other lines to $GITHUB_OUTPUT as
      # extra outputs. The input is never echoed either — a line starting `::`
      # would be read as a workflow command — so the messages here are fixed
      # text, and every value that reaches
      # $GITHUB_OUTPUT, including the SHA `gh` returns, passes the same check
      # first. The API only ever returns a full hash, so that one is held to
      # exactly 40 hex characters; anything else is a failed lookup.
      - name: Resolve commit
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            if [[ ! $INPUT_SHA =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "::error::The 'sha' input must be a commit hash: 7-40 hex characters on one line, nothing else."
              exit 1
            fi
            sha="$INPUT_SHA"
          else
            sha=$(gh run list --workflow ci.yml --branch main --event push \
              --status success --limit 1 --json headSha --jq '.[0].headSha')
            if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Could not resolve a commit to deploy: no successful push CI run on main, or the lookup returned something that is not a commit hash."
              exit 1
            fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # main, not the target: the ancestry check below needs main's history,
      # and the target is checked out from it only once it has passed.
      # persist-credentials: false — nothing after this step talks to
      # the remote, and the build runs dependency code that has no business
      # finding a token in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          lfs: false
          persist-credentials: false
          # Full history, so the ancestry check below can connect the target
          # commit to main. A shallow clone has neither side's parents and
          # `merge-base` could only ever answer "no". With fetch-depth 0,
          # checkout also fetches every branch into refs/remotes/origin/*, so
          # origin/main is present without a second, credentialed fetch.
          fetch-depth: 0

      # Rollback stays possible, but only to a commit that was once main: a
      # merged, reviewed state, not whatever a branch or tag happens to point
      # at. It runs before `npm ci`, so a refused commit never gets as
      # far as executing its own build config, let alone reaching the deploy.
      # It lives in the build job rather than beside the token: it
      # needs git history, and `deploy` deliberately has none.
      #
      # Checked for the workflow_run path too, where it should never fire: the
      # resolved commit came from a push to main. The one case it catches there
      # is a force-push that rewrote main after CI passed — and a commit main
      # does not contain should not ship either.
      #
      # `rev-parse` also turns an abbreviated `sha` input into the full hash,
      # which is what the deploy job logs and what the output carries.
      #
      # Its output is held to a full 40-character hash before it is written,
      # for the same reason as above: nothing reaches $GITHUB_OUTPUT
      # unchecked. `$SHA` itself is safe to echo — the previous step validated
      # it.
      - name: Refuse commits not on main
        id: verify
        shell: bash
        env:
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          if ! full=$(git rev-parse --verify --quiet "${SHA}^{commit}"); then
            echo "::error::Refusing to deploy $SHA: no such commit in this repository's history."
            exit 1
          fi
          if [[ ! $full =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Refusing to deploy $SHA: it did not resolve to a single full commit hash."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$full" origin/main; then
            echo "::error::Refusing to deploy $full: it is not an ancestor of origin/main. Deploy a commit that has been merged to main."
            exit 1
          fi
          git checkout --quiet --detach "$full"
          echo "Deploying $full"
          echo "sha=$full" >> "$GITHUB_OUTPUT"

      # Built here, not inside the Static Web Apps container, where Oryx picks
      # its own Node: uploading with skip_app_build means what ships came off
      # the toolchain that passed CI. `.nvmrc` is read from the target commit,
      # checked out by the step above.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # --ignore-scripts: install scripts are the one place a
        # compromised or typo-squatted dependency runs code without anyone
        # importing it. This job does not hold the deployment token, but it
        # produces the bundle that ships.
        # The app does not need them — the only package in the
        # lockfile with an install script is fsevents (macOS-only, optional,
        # never installed here), and vite 8's native pieces (rolldown,
        # lightningcss) arrive as prebuilt platform packages through
        # optionalDependencies, not a postinstall. Checked by running
        # `npm ci --ignore-scripts && npm run build` against a clean tree. If a
        # future dependency does need its script, the build fails here loudly
        # rather than silently shipping without it; allow that one package
        # explicitly rather than dropping the flag.
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # dist/ holds no dotfiles (staticwebapp.config.json comes from public/),
      # so upload-artifact's default of skipping hidden files loses nothing.
      # One day is plenty: the deploy job downloads it minutes from now, and a
      # rollback rebuilds from the commit rather than reusing an old artifact.
      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Deploy
    # The job that holds the deployment token runs in an environment, so
    # the rules around *who and what may deploy* live in repo settings, where
    # no branch can edit them — unlike the checks in this file, which a
    # dispatched ref supplies itself. Naming the environment does nothing on
    # its own; it needs two settings changes by a repo admin:
    #
    #   - Move AZURE_STATIC_WEB_APPS_API_TOKEN from repository secrets to the
    #     `production` environment's secrets, and delete the repository-level
    #     copy. Until then any workflow on any branch can still read it.
    #   - Under the environment's deployment branches and tags, choose
    #     "Selected branches and tags" and allow the branch `main` and nothing
    #     else — no tag patterns. `workflow_run` runs report the
    #     default branch as their ref, so the gated path is unaffected, and a
    #     rollback is a dispatch on main with the `sha` input. A dispatch from
    #     any other branch or tag is refused before this job's first step.
    #     Required reviewers are optional on top.
    #
    # With the secret scoped this way, a ref that rewrites this file can still
    # start a run, but not one that can see the token.
    environment: production
    # No `id-token: write`. This deploys with the Static Web App's deployment
    # token, not with a GitHub federated identity — see the Build And Deploy
    # step. Nor anything else: downloading an artifact from the same run uses
    # the runner's own artifact credentials, not GITHUB_TOKEN, and this job
    # checks nothing out.
    permissions: {}
    steps:
      - name: Report commit
        env:
          SHA: ${{ needs.build.outputs.sha }}
        run: echo "Deploying $SHA"

      # Into dist/ in an otherwise empty workspace: no checkout, so nothing
      # from the repository runs here — only the bundle the build job made,
      # and the Azure action (whose pin covers less than it looks: see the
      # next step).
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Build And Deploy
        id: builddeploy
        # Third-party and holding the deployment token, on a ref the upstream
        # can move. Worth pinning to a commit SHA — but the SHA pins less than
        # every other pin in this repo, and that is a residual risk.
        #
        # What the SHA fixes is the action's wrapper: action.yml, a two-line
        # entrypoint.sh (`cd /bin/staticsites/ && ./StaticSitesClient
        # $INPUT_ACTION`) and a Dockerfile. The Dockerfile starts
        # `FROM mcr.microsoft.com/appsvc/staticappsclient:stable`, a movable
        # tag, and the runner builds it fresh on every run. So StaticSitesClient
        # — the binary that actually reads the token and uploads — is whatever
        # Microsoft has published as `stable` that day, and no pin in this file
        # constrains it. (Checked against this SHA's tree, 2026-09-24.)
        #
        # Pinning the image by digest instead — a `docker://…staticappsclient
        # @sha256:…` step with the inputs passed as INPUT_* env — was
        # considered and not done. It relies on an undocumented contract (the
        # image layout, the working directory, which INPUT_* and GITHUB_*
        # variables the client reads), nothing here can test it short of a
        # production deploy, and a frozen client is the same trap as the frozen
        # `v1` tag below: the service moves on and starts rejecting it. The
        # trust placed in Microsoft's `stable` tag is the same trust placed in
        # the service the token authenticates to; the token being scoped to
        # this one Static Web App (and rotatable in the portal) bounds what a
        # bad image could do with it.
        #
        # The trap: upstream publishes `v1` as BOTH a tag and a branch, and they
        # are years apart. The tag is frozen at 2021-03-03; the branch is where
        # the action is actually maintained. Resolving `v1` to a SHA picks up the
        # tag: a 2021 build of a service that has moved on, which rejects
        # `skip_api_build` as an unknown input. Pinned to the branch head
        # instead.
        #
        # Dependabot cannot see that distinction: it resolves `v1` to the tag
        # and proposes moving this pin back to 2021. It is
        # excluded in dependabot.yml for that reason, so unlike every other
        # action here this SHA does not rot forward on its own — raising it
        # means reading the v1 branch and editing this line by hand.
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1 branch, 2024-09-11
        # DO NOT pass `github_id_token` here. Offering one makes this action take
        # the GitHub-federated-identity path, and the Static Web App authorises by
        # deployment token (`deploymentAuthPolicy: DeploymentToken`,
        # `federatedIdentityClientId: null`) — so the exchange cannot succeed. It
        # fails as "No matching Static Web App was found or the api key was
        # invalid", which reads as a bad token and sends you hunting the
        # credential rather than the credential *type*. Both halves have to agree:
        # pass an id token only if the app is configured for federated identity.
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          # With skip_app_build, app_location is the built output to upload
          # rather than the source to build — here the artifact downloaded
          # above — and output_location goes unused.
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true
