name: Roster

# The `ignored` roster makes a promise the code cannot keep on its own: every
# entry names an issue where the missing work is tracked, so a reader who hits a
# limitation can follow the link and find out what is happening about it.
# `directiveSupport.test.ts` asserts the number is *there*. Nothing asserted it
# still pointed at an open issue, and that is how the roster went stale —
# `TZ_ALIAS` named #159 for months after #159 closed, so the link led to a fixed
# bug and a preview that still ignored the config (#227).
#
# This cannot live in `npm test`. That suite is deliberately hermetic — no
# filesystem, no network, runs wherever the engine runs — and asking GitHub
# whether an issue is open gives that up. A schedule is where a check is allowed
# to be slow and online, and the roster changes on the scale of months, so a
# weekly answer is as timely as this needs to be.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

# Reading issue state is all this does. It opens nothing and comments nowhere.
permissions:
  contents: read
  issues: read

jobs:
  ignored-issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # No `cache: npm` and no install: the script imports
          # directiveSupport.ts through Node's own type stripping, which works
          # because that file has no imports of its own. Adding an `npm ci` here
          # would buy nothing but a slower job and a lockfile this check does
          # not otherwise depend on.
          node-version-file: .nvmrc

      - name: Every ignored directive still points at an open issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-ignored-issues.mjs
