name: Environment

# The deploy workflow is only as safe as two settings of the `production`
# environment that no file in the repository records: its deployments are
# limited to `main`, and the deployment token is an environment secret rather
# than a repository one. docs/deployment.md states both; this checks them weekly
# through the API, so the statement is verified rather than assumed.
# scripts/check-production-environment.mjs says what each check reads.
on:
  schedule:
    - cron: '0 7 * * 1'
  workflow_dispatch:

# The environment endpoints read with `actions: read`, and the rulesets that
# protect `main` (GET /rules/branches/main) with `contents: read`; no extra
# permission is granted for them. Classic branch protection and the secret
# names need permissions no GITHUB_TOKEN can hold ("Administration: read",
# and "Environments: read" plus "Secrets: read"): the secret check uses
# SECRETS_READ_TOKEN (a fine-grained token, Environments and Secrets both
# read-only), and classic protection, when a requirement is not already met
# by a ruleset, is reported as skipped with a warning.
permissions:
  contents: read
  actions: read

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: production deploys from main only, holds the deployment token, and main is protected
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SECRETS_READ_TOKEN: ${{ secrets.SECRETS_READ_TOKEN }}
        run: node scripts/check-production-environment.mjs

  # A failed scheduled run opens an issue, or comments on the one already
  # open (#573): a red scheduled run is a mark nobody is subscribed to. No
  # checkout, so the token that can write to the tracker never meets the code
  # the run executed.
  report:
    needs: [production]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: Bimmiest/shared-workflows/.github/actions/open-or-update-issue@8918b365c38c0dcff8f00597b1d7c194dc238cea # v1.2.0
        with:
          label: scheduled-environment
          title: The weekly production environment check failed
          body: |
            The weekly check found the `production` environment or main's protection not as docs/deployment.md states. The run log names what is missing.

            Run: {run}
