# The advisory review of a Dependabot pull request (#838): one comment that
# says what in the release notes can break the places that use each package.
# It is advice. It is never a required check, and nothing merges because of
# it. shared-workflows' docs/consuming.md describes the two jobs: the facts
# job has no secret and reads the pull request's checkout; the review job
# holds the credential and does not check out the pull request.
name: Dependabot review

on:
  pull_request:
    types: [opened, reopened, labeled]

permissions: {}

concurrency:
  group: dependabot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  facts:
    # A GitHub Actions update changes this workflow, so its run would use the
    # new, unreviewed actions in the job that holds the credential (#840).
    if: >-
      (github.event.pull_request.user.login == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'claude-review'))
      && !startsWith(github.head_ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: Bimmiest/shared-workflows/.github/actions/dependabot-review-facts@70ba9ba1189f19063ddee2207d04808fbe99ecdf # v1.10.0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-review-facts
          path: dependabot-review-facts.json
          retention-days: 7

  review:
    needs: facts
    # GitHub gives a pull request from a fork no identity token.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependabot-review-facts

      - uses: Bimmiest/shared-workflows/.github/actions/dependabot-review@70ba9ba1189f19063ddee2207d04808fbe99ecdf # v1.10.0
        with:
          # Not secrets: the rule in the Anthropic Console decides which runs
          # get a token (#842).
          federation-rule-id: fdrl_019JuogS4vtpW2xbixkUqfwE
          organization-id: 0be07ec3-20d1-498d-883a-27c3b01be27b
          service-account-id: svac_018n1Tu5qTKSKzknFjtUX83p
          workspace-id: wrkspc_01VnVpMBnQmEBHrE7F4DjTrH
