# The advisory review of a Dependabot pull request (#838): one comment that
# says what in the release notes can break the places that use each package.
# It is advice. It is never a required check, and nothing merges because of
# it. shared-workflows' docs/consuming.md describes the two jobs: the facts
# job has no secret and reads the pull request's checkout; the review job
# holds the key and does not check out the pull request.
name: Dependabot review

on:
  pull_request:
    types: [opened, reopened, labeled]

permissions: {}

concurrency:
  group: dependabot-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  facts:
    # A GitHub Actions update changes this workflow, so its run would use the
    # new, unreviewed actions in the job that holds the credential (#840).
    if: >-
      (github.event.pull_request.user.login == 'dependabot[bot]' || contains(github.event.pull_request.labels.*.name, 'claude-review'))
      && !startsWith(github.head_ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: Bimmiest/shared-workflows/.github/actions/dependabot-review-facts@c7eb22cdb11494cfa6b575cd8c48a5aadcd1d950 # v1.9.0

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependabot-review-facts
          path: dependabot-review-facts.json
          retention-days: 7

  review:
    needs: facts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    env:
      # Until the Dependabot secret exists, the job does nothing rather than fail.
      HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: No API key, so no review
        if: env.HAS_KEY != 'true'
        run: echo "::notice::The ANTHROPIC_API_KEY Dependabot secret is not set, so this update gets no advisory review."

      - if: env.HAS_KEY == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - if: env.HAS_KEY == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependabot-review-facts

      - if: env.HAS_KEY == 'true'
        uses: Bimmiest/shared-workflows/.github/actions/dependabot-review@c7eb22cdb11494cfa6b575cd8c48a5aadcd1d950 # v1.9.0
        with:
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
