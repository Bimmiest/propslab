<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/toolkit.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No 'unsafe-eval': MonacoEditor.tsx imports monaco-editor's slim
      monaco-editor/editor entry and the features/*/register modules it uses,
      never the barrel, so the TypeScript/JSON/CSS/HTML language services
      (the parts that need eval) are never in the bundle. Verified by loading a
      production build in Chromium with this policy and exercising the editor.
      'wasm-unsafe-eval' permits compiling WebAssembly and nothing else: every
      user regex runs on PCRE2 compiled to wasm (packages/pcre2-wasm), which
      this page and each worker load for themselves from the one built asset.
      'unsafe-inline' in style-src stays — Tailwind and Monaco's dynamic theming
      both write inline styles. img-src needs data: because Monaco draws its
      error/warning squiggles as inline data: SVGs; with only default-src to
      fall back on, the browser blocked them and the underlines silently did
      not render. frame-ancestors cannot be set from a <meta> tag; it needs a
      response header from the host, which public/staticwebapp.config.json now
      sends. That file carries frame-ancestors ALONE rather than a copy of this
      policy: two full policies in two places drift, only this one is what the
      e2e suite asserts against, and a browser enforces the intersection of both
      — so the drift would surface as a resource blocked for no visible reason.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; font-src 'self' data:;" />
    <title>Propslab</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
