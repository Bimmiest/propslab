<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/toolkit.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No 'unsafe-eval': MonacoEditor.tsx imports monaco-editor's slim
      monaco-editor/editor entry and the features/*/register modules it uses,
      never the barrel, so the TypeScript/JSON/CSS/HTML language services
      (the parts that need eval) are never in the bundle. Verified by loading a
      production build in Chromium with this policy and exercising the editor.
      'wasm-unsafe-eval' permits compiling WebAssembly and nothing else: every
      user regex runs on PCRE2 compiled to wasm (pcre2-wasm-utf16), which
      this page and each worker load for themselves from the one built asset.
      'unsafe-inline' in style-src stays — Tailwind and Monaco's dynamic theming
      both write inline styles. img-src needs data: because Monaco draws its
      error/warning squiggles as inline data: SVGs; with only default-src to
      fall back on, the browser blocked them and the underlines silently did
      not render. worker-src has no blob: because every worker is a same-origin
      file: MonacoEnvironment.getWorker hands Monaco its worker, so Monaco's
      blob: bootstrap is never reached.

      A <meta> policy covers this document only; a worker takes its policy from
      its own response headers. public/staticwebapp.config.json therefore sends
      this policy as a header too, plus frame-ancestors, which a <meta> tag
      cannot set. This copy stays for `vite preview` and local runs, and
      src/__tests__/deployHeaders.test.ts fails if the header drops a directive
      this one has (a browser enforces the intersection of both).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; font-src 'self' data:; form-action 'none';" />
    <title>Propslab</title>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
